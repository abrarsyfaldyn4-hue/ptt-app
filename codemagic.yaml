workflows:
  android-debug:
      name: Android Debug Build
          max_build_duration: 30
              environment:
                    flutter: stable
                        scripts:
                              - name: Generate missing android files
                                      script: |
                                                flutter create --platforms=android .
                                                          perl -i -pe "s#<application#<uses-permission android:name='android.permission.RECORD_AUDIO' /><uses-permission android:name='android.permission.INTERNET' /><application#" android/app/src/main/AndroidManifest.xml
                                                                - name: Get packages
                                                                        script: |
                                                                                  flutter pub get
                                                                                        - name: Build APK
                                                                                                script: |
                                                                                                          flutter build apk --debug
                                                                                                              artifacts:
                                                                                                                    - build/app/outputs/**/*.apk