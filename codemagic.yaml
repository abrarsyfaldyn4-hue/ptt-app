workflows:
  android-debug:
      name: Android Debug Build
          max_build_duration: 30
              environment:
                    flutter: stable
                        scripts:
                              - name: Generate missing android files
                                      script: |
                                                flutter create --platforms=android .
                                                      - name: Get packages
                                                              script: |
                                                                        flutter pub get
                                                                              - name: Build APK
                                                                                      script: |
                                                                                                flutter build apk --debug
                                                                                                    artifacts:
                                                                                                          - build/app/outputs/**/*.apk